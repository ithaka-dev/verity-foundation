# Tooling config scoped to the redaction gate. The control center is not a Python project — it has
# a handful of gate scripts, no package — so a repo-wide type-checker regime is deliberately not set
# up here (that is a separate, larger call). This file configures ruff + mypy for THIS directory so
# the gate's own type hints are verified rather than left to rot, per ADR 0018 sign-off. meta.yml
# runs both, pinned, before the gate itself.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PL", "EXE"]

[tool.mypy]
python_version = "3.12"
strict = true
# No ignore_missing_imports for yaml: types-PyYAML is installed in CI (meta.yml) and a local run
# should install it too. Silently typing yaml.safe_load as Any locally while CI checks it for real
# is the CI-strict-but-not-local gap we would rather fail loudly on.
