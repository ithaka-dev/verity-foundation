# OpenTelemetry collector — the enforcement point.
#
# ## Why redaction lives here and not in the callers
#
# Every service is asked to fingerprint secrets rather than emit them, and the app template makes
# that the convenient path. But a convention only holds while everyone follows it, and the failure
# mode is unrecoverable: a value emitted once is stored, indexed and replicated before anyone reads
# the line.
#
# So the collector is where it is *made* true. It sees every span and log from every repository,
# including ones written by third parties from the template, and it is the last place a value can be
# stopped. A caller-side rule protects the callers that remembered.
#
# **This file fails closed.** Unknown attributes are dropped rather than passed through, so adding
# telemetry means adding it here too. That is deliberate friction: the alternative is an allowlist
# that silently grows into a passthrough.
#
# Deployed by the Nix module in `deployments/modules/observability.nix`.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  # — 1. Drop attributes that must never exist —
  #
  # Deletion by pattern, before anything else runs. A hashed value would still be a value, and
  # `_fp` fields are already fingerprints by the time they arrive.
  attributes/strip-secrets:
    actions:
      - key: verity.holder
        action: delete
      - key: verity.license_id
        action: delete
      # Anything a service invented that names itself a secret. The pattern deliberately catches
      # camelCase too — an earlier version of the app template's own denylist did not, and in a
      # camelCase codebase that meant it caught almost nothing.
      - pattern: ^(?i).*(private[_-]?key|secret|passphrase|password|mnemonic|api[_-]?key|credential|seed).*$
        action: delete

  # — 2. Drop every attribute that is not on the conventions' closed safe-set —
  #
  # This is where "unknown attributes are dropped" is *made* true. `allow_all_keys: false` means the
  # processor deletes any span/log/metric-datapoint attribute whose key is not in `allowed_keys`
  # below (it deletes — it does not mask). An accidentally-emitted holder attribute with an innocent
  # name never reaches an exporter, whatever the callers did. Proven against the real pinned binary
  # by `redaction_gate/` — reverting `allow_all_keys` to true turns that gate red.
  #
  # `allowed_keys` is the closed set from `conventions.md`, plus the metric label keys the alerts in
  # `alerts.yaml` key on (check/disposition/outcome/refusal/tcb_status) — omitting those would
  # silently break F-09/TCB alerting, which is a different fail. Adding telemetry means adding its
  # key here, deliberately, in the same change (conventions.md "Adding an attribute"). Resource
  # attributes (service.name, verity.component, verity.chain_id) are process-level, not datapoint
  # attributes, so this processor does not see them — they are governed by the conventions doc, not
  # here.
  #
  # blocked_values stays as a value-shaped backstop for anything on the allow-list that could still
  # carry a key: PEM and JWT shapes are unambiguous; bare 64-hex is deliberately NOT matched,
  # because a bytes32 is that shape and compose hashes are exactly what this pipeline correlates on.
  redaction:
    allow_all_keys: false
    allowed_keys:
      # — span/log attributes (conventions.md, "Identifiers that are safe" + "Outcome") —
      - verity.app_manifest
      - verity.version
      - verity.compose_hash
      - verity.image_digest
      - verity.app_id
      - verity.cvm_id
      - verity.license_fp
      - verity.outcome
      - verity.refusal_reason
      # — verification spans (conventions.md, "Verification spans") —
      - verity.verify.outcome
      - verity.verify.refusal
      - verity.verify.checks
      - verity.verify.dispositions
      - verity.verify.mrconfigid_version
      - verity.verify.tcb_status
      - verity.verify.advisory_ids
      # — metric label keys (alerts.yaml keys on these; bare, per the Prometheus label names) —
      - check
      - disposition
      - outcome
      - refusal
      - tcb_status
    blocked_values:
      - '-----BEGIN[A-Z ]*PRIVATE KEY-----'
      - '\bey[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.'
    summary: silent

  # — 3. Bound cardinality —
  #
  # `verity.refusal_reason` is specified as a stable code. If a service emits free text instead it
  # becomes an unbounded label, which is both a cost problem and a leak: free text is where a caught
  # exception quotes a holder's record.
  transform/enforce-codes:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["verity.refusal_reason"], "unspecified")
            where attributes["verity.refusal_reason"] != nil
              and Len(attributes["verity.refusal_reason"]) > 64

  batch:
    timeout: 5s
    send_batch_size: 512

  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

exporters:
  otlphttp/tempo:
    endpoint: http://127.0.0.1:4319
  prometheus:
    endpoint: 127.0.0.1:9464
  otlphttp/loki:
    endpoint: http://127.0.0.1:3100/otlp

service:
  # Order matters: strip, then redact, then bound, then batch. Batching first would mean a secret
  # sitting in a buffer, which is a smaller window and still a window.
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        - memory_limiter
        - attributes/strip-secrets
        - redaction
        - transform/enforce-codes
        - batch
      exporters: [otlphttp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/strip-secrets, redaction, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors:
        - memory_limiter
        - attributes/strip-secrets
        - redaction
        - batch
      exporters: [otlphttp/loki]

  telemetry:
    logs:
      level: info
