# EA-4 shape-completeness fixture (2026-08-27 review, F2): reqwest declared under
# [dev-dependencies], not [dependencies]. Asserts that dependency_tables' DEP_SECTIONS loop
# actually scans dev-dependencies rather than merely claiming to — a fixture that only ever puts
# reqwest under [dependencies] cannot tell this branch apart from a deleted one.
[package]
name = "audit-fixture-dev-dependencies"
version = "0.0.0"
edition = "2021"

[dependencies]
serde = "1"

[dev-dependencies]
reqwest = "0.12"
