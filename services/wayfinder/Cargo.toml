[package]
name = "verity-wayfinder"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Navigation aid: which repo owns what, which decision binds it, and what to read first. Never part of the licence, attestation or payment path."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
