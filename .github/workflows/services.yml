name: services

# `services/wayfinder` is a Rust crate that had **no CI at all**. Its tests had only ever run on
# whoever's laptop last touched them, which is the same shape as the four gates this project shipped
# green-while-doing-nothing in one week — except here there was nothing to be green.
#
# Path-filtered like `deployments.yml`, so a documentation commit does not spin up a Rust toolchain.
# The filter includes this file: a workflow that cannot re-run itself on its own change is a workflow
# whose edits are unverified.
on:
  push:
    branches: [main]
    paths: ['services/**', '.github/workflows/services.yml']
  pull_request:
    paths: ['services/**', '.github/workflows/services.yml']

jobs:
  wayfinder:
    name: wayfinder · fmt · clippy · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/wayfinder
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/wayfinder
      - run: cargo fmt --all -- --check
      # `-D warnings` rather than a bare clippy run. The crate sets `unwrap_used`, `expect_used` and
      # `panic` to `warn`, which without this flag means they are advisory and nothing enforces them.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  # T-18. Floors just below current, so a regression trips them. **Raise them as coverage improves;
  # never lower one to make a build pass** — a change that justifies a lower floor should argue for
  # it in the commit message, where a reviewer sees it.
  #
  # `--fail-under-file-lines` is not redundant with the total: a total hides a module going dark
  # while the average stays healthy, and it means a new module cannot arrive untested. That matters
  # more than usual here, because this crate's whole content is a map that has to stay accurate.
  wayfinder-coverage:
    name: wayfinder · coverage floors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/wayfinder
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/wayfinder
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: |
          cargo llvm-cov --all-features --summary-only \
            --fail-under-lines 97 \
            --fail-under-functions 90 \
            --fail-under-file-lines 95

  # C1: this service navigates the project and must never join the licence, attestation or payment
  # path. That boundary is one dependency away from gone — adding an RPC client or a signing crate
  # here would be the first step, and it would look like a convenience.
  #
  # Asserted against the manifest rather than trusted, because C1 is a repo invariant and the whole
  # argument for `services/` existing at all is that it stays on the other side of it.
  no-product-dependencies:
    name: navigation only, never the trust path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5          # EA-3 determinism: pin the interpreter,
        with:                                   # do not inherit ubuntu-latest's default python3
          python-version: '3.12'
      - name: gate — lint & types (ruff, mypy)  # ADR 0018 sign-off, same pins as meta.yml/EA-1
        run: |
          python -m pip install --quiet ruff==0.8.6 mypy==1.14.1
          # Both .py in the directory: the gate (hyphenated, run as a script) and the frozen
          # _legacy_parser.py the self-test imports. ruff walks up from each target to the
          # pyproject; mypy discovers config from the CWD, so it MUST be pointed at the
          # directory's pyproject with --config-file or it silently runs non-strict (verified —
          # the same trap already found and fixed in meta.yml's EA-1 step).
          ruff check services/wayfinder/check-navigation-only.py services/wayfinder/_legacy_parser.py
          mypy --config-file services/wayfinder/pyproject.toml \
            services/wayfinder/check-navigation-only.py services/wayfinder/_legacy_parser.py
      - name: no chain, crypto or attestation dependencies
        run: python3 services/wayfinder/check-navigation-only.py
      - name: dependency-gate self-test (the three audit bypasses stay refused)
        run: python3 services/wayfinder/check-navigation-only.py --self-test
