name: deployments

on:
  push:
    branches: [main]
    paths: ['deployments/**', 'observability/**', '.github/workflows/deployments.yml']
  pull_request:
    paths: ['deployments/**', 'observability/**', '.github/workflows/deployments.yml']

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Runs the host evaluation *and* the gates — C2's secret grep and the observability config
      # parse. Both are defined for every system rather than for x86_64-linux alone: an earlier
      # version reported "all checks passed" on a developer's Mac having run neither, and a gate
      # that silently does not run is worse than an absent one, because it is believed.
      - run: nix flake check ./deployments --print-build-logs
      # `nix fmt` resolves the flake from the working directory, so it must be run from inside
      # `deployments/` — passing the path as an argument made it look for a flake at the repo root
      # and fail, which is how this job was red from the day it was added.
      #
      # Explicit file list rather than `.`: nixfmt deprecates directory arguments, and a deprecation
      # that becomes an error later would break this the same silent way.
      - name: nix fmt --check
        working-directory: deployments
        run: nix fmt -- --check $(git ls-files '*.nix')
