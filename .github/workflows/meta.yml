name: meta

# The control-center gate. Unlike deployments.yml and services.yml, this has NO path
# filter: it runs on every push and PR, whatever changed. That is the whole point —
# EA-3 exists because docs/, records/, closed-loop/ and the root docs (the file class a
# coordination repo is mostly made of) had no CI at all, so "every push is verified" was
# unenforceable for them and the audit's dead links, missing index rows and statusless
# docs were invisible. Every check here was written from a captured failure and is green
# on the tree it shipped with; see .github/checks/ for the per-check rationale.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  meta:
    name: docs · data · shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install tools (pyyaml, shellcheck, promtool)
        run: |
          python -m pip install --quiet pyyaml
          # Pin ShellCheck to an exact release rather than `apt install shellcheck`:
          # the ShellCheck version decides which checks exist, so an apt version that
          # drifts from what was verified locally makes the gate non-deterministic — it
          # flagged SC2015 on a valid `A && B || C` guard that 0.11.0 correctly does not.
          # A fixed binary is reproducible locally and in CI.
          SC_VERSION=0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SC_VERSION}/shellcheck-v${SC_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo mv "shellcheck-v${SC_VERSION}/shellcheck" /usr/local/bin/shellcheck
          PROM_VERSION=2.53.2
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | tar -xz
          sudo mv "prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          shellcheck --version | head -2
          promtool --version

      # Each check is its own step so a failure names itself in the step list, per the
      # "read the step list, not the badge" rule. `if: always()` on the checks after the
      # first means one red check does not mask the others — every check runs every time.
      - name: markdown links resolve
        if: always()
        run: python3 .github/checks/check-markdown-links.py

      - name: ADR index coverage
        if: always()
        run: python3 .github/checks/check-adr-index.py

      - name: document status lines
        if: always()
        run: python3 .github/checks/check-status-lines.py

      - name: JSON/YAML parse
        if: always()
        run: python3 .github/checks/check-data-parses.py

      - name: shell (bash -n + shellcheck)
        if: always()
        run: bash .github/checks/check-shell.sh

      - name: prometheus alert rules (promtool)
        if: always()
        run: promtool check rules observability/alerts.yaml

      # The redaction gate is a real Python program, so its own type hints are verified rather than
      # left to rot (ADR 0018 sign-off). Pinned, scoped to that directory via its pyproject.toml —
      # the control center is not a Python project, so there is deliberately no repo-wide regime.
      - name: redaction gate — lint & types (ruff, mypy)
        if: always()
        run: |
          python -m pip install --quiet ruff==0.8.6 mypy==1.14.1 types-PyYAML==6.0.12.20241230
          ruff check observability/redaction_gate
          mypy observability/redaction_gate

      # EA-1: prove collector.yaml is fail-closed by running the REAL collector binary against a
      # hostile fixture — a YAML lint cannot verify what the redaction processor does. Pinned to the
      # version deployments/ (nixpkgs 25.05) resolves, and checksum-verified against the digest
      # pinned here, so a swapped binary is caught. The gate itself runs both a guarantee pass and a
      # liveness pass (see observability/redaction_gate/README.md).
      - name: telemetry redaction is fail-closed (real collector)
        if: always()
        run: |
          OTEL_VERSION=0.124.0
          EXPECTED=4fe107b8e586a8547f0bdaab76f98d5eaf1335b90a23228bc5a1532bd600e663
          curl -fsSL -o /tmp/otelcol.tgz \
            "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${OTEL_VERSION}/otelcol-contrib_${OTEL_VERSION}_linux_amd64.tar.gz"
          echo "${EXPECTED}  /tmp/otelcol.tgz" | sha256sum -c -
          tar -xzf /tmp/otelcol.tgz -C /tmp otelcol-contrib
          OTELCOL_CONTRIB=/tmp/otelcol-contrib python3 observability/redaction_gate/redaction_gate.py
